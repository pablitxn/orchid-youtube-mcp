name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Ruff formatter check
        run: uv run ruff format --check src tests

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Mypy
        run: uv run mypy src

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -m "not integration and not e2e" --cov-fail-under=0

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Integration tests - only on main branch or when explicitly triggered
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    needs: [lint, type-check, test]
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Start integration storage
        run: |
          ci_minio_access_key="ci$(openssl rand -hex 8)"
          ci_minio_secret_key="$(openssl rand -hex 20)"
          ci_mongo_username="ci$(openssl rand -hex 8)"
          ci_mongo_password="$(openssl rand -hex 20)"
          echo "::add-mask::$ci_minio_access_key"
          echo "::add-mask::$ci_minio_secret_key"
          echo "::add-mask::$ci_mongo_username"
          echo "::add-mask::$ci_mongo_password"
          printf 'YOUTUBE_MCP_IT_MINIO_ACCESS_KEY=%s\nYOUTUBE_MCP_IT_MINIO_SECRET_KEY=%s\n' "$ci_minio_access_key" "$ci_minio_secret_key" >> "$GITHUB_ENV"
          printf 'YOUTUBE_MCP_IT_MONGODB_URI=mongodb://%s:%s@127.0.0.1:27017/?authSource=admin\n' "$ci_mongo_username" "$ci_mongo_password" >> "$GITHUB_ENV"
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$ci_minio_access_key" \
            -e MINIO_ROOT_PASSWORD="$ci_minio_secret_key" \
            bitnami/minio:latest server /data
          docker run -d --name mongodb \
            -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME="$ci_mongo_username" \
            -e MONGO_INITDB_ROOT_PASSWORD="$ci_mongo_password" \
            mongo:7
          printf 'YOUTUBE_RAG__BLOB__ACCESS_KEY=%s\nYOUTUBE_RAG__BLOB__SECRET_KEY=%s\n' "$ci_minio_access_key" "$ci_minio_secret_key" >> "$GITHUB_ENV"
          printf 'YOUTUBE_RAG__DOCUMENTDB__URI=mongodb://%s:%s@127.0.0.1:27017/?authSource=admin\n' "$ci_mongo_username" "$ci_mongo_password" >> "$GITHUB_ENV"

      - name: Wait for MinIO
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Wait for MongoDB
        run: |
          for _ in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet --eval 'db.adminCommand("ping")' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mongodb
          exit 1

      - name: Run integration tests
        run: uv run pytest -m integration --cov-fail-under=0
        env:
          YOUTUBE_RAG__BLOB__ENDPOINT: http://localhost:9000
          YOUTUBE_RAG__VECTORDB__HOST: localhost
          YOUTUBE_RAG__VECTORDB__PORT: 6333
